<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAN DO IT</title>
<meta name="description" content="167구절 100일 암송 노트">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAN DO IT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1E3558">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2E9; --card:#FFFFFF; --ink:#211D15; --soft:#6A6253; --rule:#DED5C0;
    --navy:#1E3558; --navy-t:#E3EAF4; --gold:#7F5A10; --gold-t:#F4E7C8;
    --sage:#47684C; --sage-t:#E4EEE3; --danger:#9A3F2E; --on-sage:#FFFFFF;
    --fs:1.14;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14181E; --card:#1C222B; --ink:#EDE7D9; --soft:#A29A88; --rule:#2E3641;
      --navy:#9DB9E3; --navy-t:#223049; --gold:#E3BE6A; --gold-t:#3A3019;
      --sage:#8DB892; --sage-t:#1F3023; --danger:#E08A78; --on-sage:#14181E;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));}
  button{font-family:inherit;color:inherit;}
  .serif{font-family:'Noto Serif KR',serif;}
  .wrap{max-width:780px;margin:0 auto;padding:0 20px;}

  /* ---------- header (fixed px so it stays compact at any text size) ---------- */
  header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);
    padding-top:env(safe-area-inset-top);}
  header .inner{max-width:780px;margin:0 auto;padding:10px 20px 10px;}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
  .mark{font-family:'Noto Serif KR',serif;font-weight:700;font-size:20px;letter-spacing:.06em;color:var(--navy);white-space:nowrap;}
  .dayno{font-size:12.5px;color:var(--soft);white-space:nowrap;}
  .fsctl{display:flex;gap:6px;flex:none;}
  .fsctl button{min-width:44px;height:36px;border-radius:18px;border:1px solid var(--rule);background:var(--card);
    font-size:15px;font-weight:600;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:1px;padding:0 10px;}
  .fsctl button small{font-size:13px;font-weight:700;}
  .fsctl button:disabled{opacity:.35;}
  .datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
  .navbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--rule);background:var(--card);
    color:var(--navy);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;}
  .navbtn:disabled{opacity:.3;}
  .datec{flex:1;min-width:0;text-align:center;}
  .datec .big{font-family:'Noto Serif KR',serif;font-weight:700;font-size:21px;}
  .datec .sub{margin-top:3px;}
  .badge{display:inline-block;padding:2px 11px;border-radius:14px;font-size:12.5px;font-weight:600;background:var(--navy-t);color:var(--navy);}

  /* ---------- lists ---------- */
  main{padding-top:18px;}
  .view{display:none;} .view.active{display:block;}
  section.block{margin-bottom:34px;}
  .bhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px;}
  .bhead h2{margin:0;font-size:1.02rem;font-weight:700;}
  .bhead .meta{font-size:.78rem;color:var(--soft);}
  .bsub{font-size:.78rem;color:var(--soft);margin:2px 2px 0;}
  .tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px 0;}
  .linkbtn{background:none;border:none;color:var(--navy);font-size:.8rem;font-weight:600;padding:6px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .track{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;margin:8px 2px 0;}
  .fill{height:100%;background:var(--sage);border-radius:3px;transition:width .25s ease;}
  ul.list{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--rule);}
  li.item{border-bottom:1px solid var(--rule);}
  .row{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;}
  .chk,.star{flex:none;background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .chk{width:34px;height:34px;margin-top:-2px;}
  .chk .box{width:26px;height:26px;border-radius:8px;border:1.7px solid var(--soft);background:var(--card);display:flex;align-items:center;justify-content:center;}
  .chk.on .box{background:var(--sage);border-color:var(--sage);}
  .chk svg{width:15px;height:15px;display:none;color:var(--on-sage);}
  .chk.on svg{display:block;}
  .main{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;cursor:pointer;}
  .tags{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
  .tag{font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:9px;}
  .tag.ot{background:var(--navy-t);color:var(--navy);}
  .tag.nt{background:var(--gold-t);color:var(--gold);}
  .num{font-size:.68rem;color:var(--soft);}
  .q{font-size:1rem;line-height:1.5;}
  .q .ref{font-weight:500;}
  .q .hint{font-family:'Noto Serif KR',serif;font-weight:700;color:var(--navy);margin-left:.35em;}
  .item.done .q{opacity:.55;}
  .star{width:34px;height:34px;font-size:1.25rem;color:var(--rule);margin-top:-2px;}
  .star.on{color:var(--gold);}
  .detail{display:none;padding:0 2px 16px 46px;}
  .detail.open{display:block;}
  .sec{margin-top:10px;}
  .sec:first-child{margin-top:0;}
  .lbl{font-size:.7rem;color:var(--soft);font-weight:600;margin-bottom:2px;}
  .ans{font-family:'Noto Serif KR',serif;font-size:.98rem;line-height:1.8;white-space:pre-line;}
  .mn{font-size:.88rem;line-height:1.65;background:var(--gold-t);color:var(--ink);border-radius:10px;padding:8px 12px;}
  .mn b{color:var(--gold);}
  .flow{font-size:.84rem;line-height:1.65;color:var(--ink);}
  .tip{font-size:.82rem;line-height:1.6;color:var(--soft);white-space:pre-line;}
  .warn{font-size:.8rem;line-height:1.55;color:var(--danger);border-left:3px solid var(--danger);padding-left:10px;}
  .yrs{font-size:.74rem;color:var(--soft);}

  /* ---------- schedule ---------- */
  .wk{margin:22px 2px 6px;}
  .wk:first-child{margin-top:4px;}
  .wk b{font-size:.95rem;color:var(--navy);}
  .wk span{font-size:.76rem;color:var(--soft);margin-left:8px;}
  .drow{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--rule);cursor:pointer;}
  .drow.today{background:var(--navy-t);border-radius:12px;border-bottom-color:transparent;}
  .drow .dd{width:56px;flex:none;}
  .drow .dd .n{font-family:'Noto Serif KR',serif;font-weight:700;font-size:1rem;}
  .drow .dd .w{font-size:.7rem;color:var(--soft);}
  .drow .mid{flex:1;min-width:0;font-size:.86rem;}
  .drow .mid small{display:block;font-size:.74rem;color:var(--soft);}
  .drow .pct{font-size:.8rem;font-weight:700;color:var(--sage);flex:none;}

  /* ---------- progress ---------- */
  .hero{text-align:center;padding:20px 0 6px;}
  .hero .big{font-family:'Noto Serif KR',serif;font-weight:700;font-size:2.4rem;color:var(--navy);line-height:1.15;}
  .hero .cap{font-size:.8rem;color:var(--soft);margin-top:4px;}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px 16px 12px;margin:16px 0;}
  .card h3{margin:0 0 2px;font-size:.98rem;}
  .card .desc{font-size:.78rem;color:var(--soft);margin-bottom:8px;}
  .wrow{display:flex;align-items:center;gap:10px;padding:5px 0;}
  .wrow .l{width:3.6rem;flex:none;font-size:.78rem;color:var(--soft);}
  .wrow .t{flex:1;height:8px;background:var(--rule);border-radius:4px;overflow:hidden;}
  .wrow .t i{display:block;height:100%;background:var(--navy);border-radius:4px;}
  .wrow .p{width:2.8rem;text-align:right;font-size:.74rem;color:var(--soft);flex:none;}
  .seg{display:flex;gap:8px;margin-top:6px;}
  .seg button{flex:1;height:48px;border-radius:12px;border:1.5px solid var(--rule);background:var(--card);cursor:pointer;
    color:var(--ink);font-family:'Noto Serif KR',serif;font-weight:700;}
  .seg button.on{border-color:var(--navy);background:var(--navy-t);color:var(--navy);}
  .flaglist{list-style:none;margin:0;padding:0;}
  .flaglist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule);}
  .flaglist .t{flex:1;font-size:.88rem;}
  .flaglist button{border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:5px 12px;font-size:.74rem;color:var(--soft);cursor:pointer;}
  .reset{display:block;margin:22px auto 6px;background:none;border:none;color:var(--danger);font-size:.8rem;text-decoration:underline;cursor:pointer;}
  .empty{font-size:.85rem;color:var(--soft);padding:10px 2px;}

  /* ---------- tab bar ---------- */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--rule);
    padding-bottom:env(safe-area-inset-bottom);}
  nav.tabs .inner{max-width:780px;margin:0 auto;display:flex;}
  nav.tabs button{flex:1;background:none;border:none;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--soft);font-size:11.5px;cursor:pointer;}
  nav.tabs button svg{width:22px;height:22px;}
  nav.tabs button.active{color:var(--navy);font-weight:600;}
  :focus-visible{outline:2.5px solid var(--navy);outline-offset:2px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){.fill{transition:none;}}
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="bar">
      <div class="brand"><span class="mark">SAN DO IT</span><span class="dayno" id="dayNo"></span></div>
      <div class="fsctl" role="group" aria-label="글씨 크기">
        <button id="fsDown" aria-label="글씨 작게">가<small>−</small></button>
        <button id="fsUp" aria-label="글씨 크게">가<small>+</small></button>
      </div>
    </div>
    <div class="datebar" id="dateNav">
      <button class="navbtn" id="prevBtn" aria-label="이전 학습일">‹</button>
      <div class="datec"><div class="big" id="dateBig"></div><div class="sub" id="dateSub"></div></div>
      <button class="navbtn" id="nextBtn" aria-label="다음 학습일">›</button>
    </div>
  </div>
</header>

<div class="wrap">
  <main id="vToday" class="view active">
    <section class="block" id="bReview">
      <div class="bhead"><h2>어제 복습</h2><span class="meta" id="rCount"></span></div>
      <div class="bsub" id="rSub"></div>
      <div class="tools"><span></span><button class="linkbtn" data-open="reviewList">정답 모두 펼치기</button></div>
      <div class="track"><div class="fill" id="rFill" style="width:0%"></div></div>
      <ul class="list" id="reviewList"></ul>
    </section>
    <section class="block" id="bToday">
      <div class="bhead"><h2>오늘 학습</h2><span class="meta" id="tCount"></span></div>
      <div class="bsub" id="tSub"></div>
      <div class="tools"><span></span><button class="linkbtn" data-open="todayList">정답 모두 펼치기</button></div>
      <div class="track"><div class="fill" id="tFill" style="width:0%"></div></div>
      <ul class="list" id="todayList"></ul>
    </section>
  </main>

  <main id="vCal" class="view"><div id="calBody"></div></main>

  <main id="vProg" class="view">
    <div class="hero"><div class="big" id="hPct">0%</div><div class="cap" id="hCap"></div></div>
    <div class="card">
      <h3>글씨 크기</h3>
      <div class="desc">누르면 바로 바뀌고, 다음에 열어도 유지돼요.</div>
      <div class="seg" id="seg"></div>
    </div>
    <div class="card">
      <h3>주차별 진행</h3>
      <div class="desc">한 주(학습일 5일)에 167구절 전체를 한 번씩 봅니다.</div>
      <div id="weekBars"></div>
    </div>
    <div class="card">
      <h3>☆ 표시한 구절</h3>
      <div class="desc" id="flagDesc"></div>
      <ul class="flaglist" id="flagList"></ul>
    </div>
    <button class="reset" id="resetBtn">진행 기록 전체 초기화</button>
  </main>
</div>

<nav class="tabs"><div class="inner">
  <button class="tabbtn active" data-v="vToday"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="M9 15l2 2 4-4"/></svg>오늘</button>
  <button class="tabbtn" data-v="vCal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>전체 일정</button>
  <button class="tabbtn" data-v="vProg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>진행</button>
</div></nav>

const ITEMS = DATA.items, DAYS = DATA.days;
const KEY = 'sandoit_v1';
const FS_STEPS = [0.88, 1, 1.14, 1.3, 1.5];
const WD = ['일','월','화','수','목','금','토'];

/* ---------- state (localStorage with safe fallback) ---------- */
let state = { done:{}, flags:[], fs:2 };
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); state.done = p.done||{}; state.flags = p.flags||[]; if(Number.isInteger(p.fs)) state.fs = Math.min(4,Math.max(0,p.fs)); }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parts = d => d.split('-').map(Number);
const fmt = (d, long) => { const [y,m,dd] = parts(d); const w = WD[new Date(y,m-1,dd).getDay()]; return long ? `${m}월 ${dd}일 (${w})` : `${m}/${dd}(${w})`; };
function todayISO(){ const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
const isDone = (d,id) => (state.done[d]||[]).includes(id);
const doneCount = day => (state.done[day.d]||[]).filter(id => day.ids.includes(id)).length;
const dayIndexByDate = {}; DAYS.forEach((r,i)=>{ dayIndexByDate[r.d] = i; });
let cur = 0;

function pickStart(){
  const t = todayISO();
  if(t <= DAYS[0].d) return 0;
  for(let i=0;i<DAYS.length;i++){ if(DAYS[i].d >= t) return i; }
  return DAYS.length-1;
}
function dayNumber(){
  const [y,m,d] = parts(DATA.start); const [y2,m2,d2] = parts(todayISO());
  const n = Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y,m-1,d)) / 86400000) + 1;
  return Math.min(DATA.total, Math.max(1, n));
}

/* ---------- font size ---------- */
function applyFs(){
  document.documentElement.style.setProperty('--fs', FS_STEPS[state.fs]);
  $('fsDown').disabled = state.fs <= 0; $('fsUp').disabled = state.fs >= FS_STEPS.length-1;
  document.querySelectorAll('#seg button').forEach((b,i)=> b.classList.toggle('on', i===state.fs));
}
function setFs(n){ state.fs = Math.min(FS_STEPS.length-1, Math.max(0,n)); applyFs(); save(); }

/* ---------- item row ---------- */
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 7"/></svg>';
function detailHTML(it){
  let h = `<div class="sec"><div class="lbl">정답</div><div class="ans">${esc(it.a)}</div></div>`;
  if(it.m) h += `<div class="sec"><div class="lbl">숫자 연상</div><div class="mn">${esc(it.m)}</div></div>`;
  if(it.f) h += `<div class="sec"><div class="lbl">흐름 키워드</div><div class="flow">${esc(it.f)}</div></div>`;
  if(it.n) h += `<div class="sec"><div class="lbl">원본 암기 팁</div><div class="tip">${esc(it.n)}</div></div>`;
  if(it.w) h += `<div class="sec"><div class="warn">${esc(it.w)}</div></div>`;
  if(it.y) h += `<div class="sec"><div class="yrs">기출 ${esc(it.y)}</div></div>`;
  return h;
}
function itemRow(id, date, refresh){
  const it = ITEMS[id];
  const li = document.createElement('li');
  const done = isDone(date,id), flagged = state.flags.includes(id);
  li.className = 'item' + (done?' done':'');
  li.innerHTML = `
    <div class="row">
      <button class="chk ${done?'on':''}" aria-label="완료 표시" aria-pressed="${done}"><span class="box">${CHECK}</span></button>
      <button class="main" aria-expanded="false">
        <div class="tags"><span class="tag ${it.t==='구약'?'ot':'nt'}">${it.t}</span><span class="num">${esc(id.replace(/^(구약|신약) /,''))}</span></div>
        <div class="q"><span class="ref">${esc(it.r)}</span><span class="hint">${esc(it.h)}</span></div>
      </button>
      <button class="star ${flagged?'on':''}" aria-label="어려운 구절 표시" aria-pressed="${flagged}">${flagged?'★':'☆'}</button>
    </div>
    <div class="detail">${detailHTML(it)}</div>`;
  const chk = li.querySelector('.chk'), star = li.querySelector('.star'), main = li.querySelector('.main'), det = li.querySelector('.detail');
  chk.addEventListener('click', () => {
    const arr = state.done[date] || [];
    const i = arr.indexOf(id); if(i>=0) arr.splice(i,1); else arr.push(id);
    state.done[date] = arr; save();
    const on = isDone(date,id);
    chk.classList.toggle('on', on); chk.setAttribute('aria-pressed', on); li.classList.toggle('done', on);
    refresh();
  });
  star.addEventListener('click', () => {
    const i = state.flags.indexOf(id); if(i>=0) state.flags.splice(i,1); else state.flags.push(id); save();
    const on = state.flags.includes(id); star.classList.toggle('on', on); star.textContent = on ? '★' : '☆'; star.setAttribute('aria-pressed', on);
  });
  main.addEventListener('click', () => { const o = det.classList.toggle('open'); main.setAttribute('aria-expanded', o); });
  return li;
}

/* ---------- today view ---------- */
function countsOT_NT(ids){ let o=0,n=0; ids.forEach(id=>{ if(ITEMS[id].t==='구약') o++; else n++; }); return [o,n]; }
function renderToday(){
  const day = DAYS[cur], prev = DAYS[cur-1];
  $('dateBig').textContent = fmt(day.d, true);
  $('dateSub').innerHTML = `<span class="badge">${day.c}주차 · 전체 1회독 ${day.k}/${day.kn}일</span>`;
  $('prevBtn').disabled = cur<=0; $('nextBtn').disabled = cur>=DAYS.length-1;
  $('dayNo').textContent = `Day ${dayNumber()} / ${DATA.total}`;

  const rl = $('reviewList'); rl.innerHTML = '';
  if(prev){
    $('bReview').style.display = '';
    const [o,n] = countsOT_NT(prev.ids);
    $('rSub').textContent = `${fmt(prev.d)}에 학습한 ${prev.ids.length}구절 · 구약 ${o} · 신약 ${n}`;
    prev.ids.forEach(id => rl.appendChild(itemRow(id, prev.d, updateCounts)));
  } else { $('bReview').style.display = 'none'; }

  const tl = $('todayList'); tl.innerHTML = '';
  const [o,n] = countsOT_NT(day.ids);
  $('tSub').textContent = `${day.ids.length}구절 · 구약 ${o} · 신약 ${n} 섞어서`;
  day.ids.forEach(id => tl.appendChild(itemRow(id, day.d, updateCounts)));
  document.querySelectorAll('.linkbtn[data-open]').forEach(b => b.textContent = '정답 모두 펼치기');
  updateCounts();
}
function updateCounts(){
  const day = DAYS[cur], prev = DAYS[cur-1];
  if(prev){ const c = doneCount(prev); $('rCount').textContent = `${c}/${prev.ids.length}`; $('rFill').style.width = (c/prev.ids.length*100)+'%'; }
  const c2 = doneCount(day); $('tCount').textContent = `${c2}/${day.ids.length}`; $('tFill').style.width = (c2/day.ids.length*100)+'%';
}

/* ---------- schedule view ---------- */
function renderCal(){
  const body = $('calBody'); body.innerHTML = '';
  const t = todayISO(); let lastWeek = 0;
  DAYS.forEach((day, i) => {
    if(day.c !== lastWeek){
      lastWeek = day.c;
      const wd = DAYS.filter(x => x.c === day.c);
      const h = document.createElement('div'); h.className = 'wk';
      h.innerHTML = `<b>${day.c}주차</b><span>${fmt(wd[0].d)} – ${fmt(wd[wd.length-1].d)} · 전체 167구절 1회독</span>`;
      body.appendChild(h);
    }
    const [o,n] = countsOT_NT(day.ids);
    const pct = Math.round(doneCount(day)/day.ids.length*100);
    const el = document.createElement('div'); el.className = 'drow' + (day.d===t?' today':'');
    el.innerHTML = `<div class="dd"><div class="n">${parts(day.d)[1]}/${parts(day.d)[2]}</div><div class="w">${WD[new Date(parts(day.d)[0],parts(day.d)[1]-1,parts(day.d)[2]).getDay()]}요일</div></div>
      <div class="mid">${day.k}/${day.kn}일차 · ${day.ids.length}구절<small>구약 ${o} · 신약 ${n}</small></div><div class="pct">${pct}%</div>`;
    el.addEventListener('click', () => { cur = i; renderToday(); show('vToday'); window.scrollTo(0,0); });
    body.appendChild(el);
  });
}

/* ---------- progress view ---------- */
function renderProg(){
  let total = 0, done = 0;
  DAYS.forEach(d => { total += d.ids.length; done += doneCount(d); });
  $('hPct').textContent = Math.round(done/total*100) + '%';
  $('hCap').textContent = `Day ${dayNumber()} / ${DATA.total} · 체크 ${done} / ${total}`;
  const wb = $('weekBars'); wb.innerHTML = '';
  const weeks = [...new Set(DAYS.map(d=>d.c))];
  weeks.forEach(w => {
    const ds = DAYS.filter(d=>d.c===w); let t=0,c=0; ds.forEach(d=>{ t+=d.ids.length; c+=doneCount(d); });
    const p = Math.round(c/t*100);
    const r = document.createElement('div'); r.className='wrow';
    r.innerHTML = `<div class="l">${w}주차</div><div class="t"><i style="width:${p}%"></i></div><div class="p">${p}%</div>`;
    wb.appendChild(r);
  });
  const fl = $('flagList'); fl.innerHTML = '';
  $('flagDesc').textContent = state.flags.length ? `${state.flags.length}구절 · 주말에 따로 한 번 더 보세요` : '어려운 구절은 오른쪽 ☆를 눌러 표시해 두세요.';
  state.flags.forEach(id => {
    const it = ITEMS[id]; const li = document.createElement('li');
    li.innerHTML = `<div class="t">${esc(it.r)} <b class="serif">${esc(it.h)}</b></div><button>해제</button>`;
    li.querySelector('button').addEventListener('click', () => { state.flags = state.flags.filter(x=>x!==id); save(); renderProg(); renderToday(); });
    fl.appendChild(li);
  });
}

/* ---------- navigation ---------- */
function show(v){
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('active', e.id===v));
  document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.v===v));
  $('dateNav').style.display = v==='vToday' ? 'flex' : 'none';
  if(v==='vCal') renderCal();
  if(v==='vProg') renderProg();
}
document.querySelectorAll('.tabbtn').forEach(b => b.addEventListener('click', () => { show(b.dataset.v); window.scrollTo(0,0); }));
$('prevBtn').addEventListener('click', () => { if(cur>0){ cur--; renderToday(); window.scrollTo(0,0); } });
$('nextBtn').addEventListener('click', () => { if(cur<DAYS.length-1){ cur++; renderToday(); window.scrollTo(0,0); } });
$('fsDown').addEventListener('click', () => setFs(state.fs-1));
$('fsUp').addEventListener('click', () => setFs(state.fs+1));
document.querySelectorAll('.linkbtn[data-open]').forEach(b => b.addEventListener('click', () => {
  const list = $(b.dataset.open); const dets = list.querySelectorAll('.detail');
  const open = ![...dets].every(d => d.classList.contains('open'));
  dets.forEach(d => d.classList.toggle('open', open));
  list.querySelectorAll('.main').forEach(m => m.setAttribute('aria-expanded', open));
  b.textContent = open ? '정답 모두 접기' : '정답 모두 펼치기';
}));
$('resetBtn').addEventListener('click', () => {
  if(confirm('체크 기록과 ☆ 표시를 모두 지울까요? 되돌릴 수 없어요.')){ state.done = {}; state.flags = []; save(); renderToday(); renderProg(); }
});
(function buildSeg(){
  const seg = $('seg');
  FS_STEPS.forEach((s,i) => { const b = document.createElement('button'); b.textContent = '가'; b.style.fontSize = (13 + i*4) + 'px'; b.setAttribute('aria-label', `글씨 크기 ${i+1}단계`); b.addEventListener('click', () => setFs(i)); seg.appendChild(b); });
})();

load(); applyFs(); cur = pickStart(); renderToday();
</script>
</body>
</html>
