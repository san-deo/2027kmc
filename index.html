<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>암송 167구절 학습노트 (웹사이트용)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F4EC;
    --paper-alt:#F1EBDD;
    --ink:#252017;
    --ink-soft:#6b6252;
    --rule:#DDD3BC;
    --navy:#20395C;
    --navy-soft:#3E5A82;
    --navy-tint:#E7EDF4;
    --amber:#9A6B14;
    --amber-tint:#F6EBD3;
    --sage:#4C6B4F;
    --sage-tint:#E7EFE6;
    --danger:#9B4030;
    --shadow: 0 1px 2px rgba(37,32,23,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
  }
  .serif{ font-family:'Noto Serif KR', serif; }
  .wrap{ max-width:700px; margin:0 auto; padding:0 20px; }

  /* top bar */
  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
  }
  header.top .inner{ max-width:700px; margin:0 auto; padding:14px 20px 12px; }
  .app-title{ font-size:13px; letter-spacing:.02em; color:var(--ink-soft); margin:0 0 10px; }
  .date-nav{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .date-nav .navbtn{
    width:40px; height:40px; border-radius:20px; border:1px solid var(--rule);
    background:#fff; color:var(--navy); font-size:18px; display:flex; align-items:center; justify-content:center;
    flex:none; cursor:pointer;
  }
  .date-nav .navbtn:disabled{ opacity:.3; }
  .date-center{ text-align:center; flex:1; min-width:0; cursor:pointer;}
  .date-center .big{ font-size:21px; font-weight:700; font-family:'Noto Serif KR',serif; }
  .date-center .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .badge{
    display:inline-block; padding:2px 10px; border-radius:20px; font-size:11.5px; font-weight:600;
  }
  .badge.a{ background:var(--navy-tint); color:var(--navy); }
  .badge.b{ background:var(--amber-tint); color:var(--amber); }

  main{ padding-top:18px; }
  section.block{ margin-bottom:30px; }
  .block-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; padding:0 2px;}
  .block-head h2{ font-size:15.5px; margin:0; font-weight:700; }
  .block-head .count{ font-size:12.5px; color:var(--ink-soft); }
  .progress-track{ height:5px; background:var(--rule); border-radius:3px; overflow:hidden; margin:8px 2px 0; }
  .progress-fill{ height:100%; background:var(--sage); border-radius:3px; transition:width .25s ease; }

  ul.itemlist{ list-style:none; margin:0; padding:0; border-top:1px solid var(--rule); }
  li.item{ border-bottom:1px solid var(--rule); }
  .item-row{ display:flex; align-items:flex-start; gap:12px; padding:13px 2px; cursor:pointer; }
  .item-row .chk{
    flex:none; width:26px; height:26px; border-radius:8px; border:1.6px solid var(--rule);
    margin-top:1px; display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .item-row .chk.on{ background:var(--sage); border-color:var(--sage); }
  .item-row .chk svg{ width:15px; height:15px; display:none; }
  .item-row .chk.on svg{ display:block; }
  .item-main{ flex:1; min-width:0; }
  .item-id{ font-size:11px; color:var(--navy-soft); font-weight:600; margin-bottom:2px; }
  .item-id.known{ color:var(--amber); }
  .item-ref{ font-size:16px; line-height:1.42; font-weight:500; }
  .item-row.done .item-ref{ color:var(--ink-soft); }
  .star{
    flex:none; width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    color:var(--rule); font-size:18px; margin-top:1px;
  }
  .star.on{ color:var(--amber); }
  .answer{
    display:none; padding:2px 2px 16px 50px; font-family:'Noto Serif KR',serif;
    font-size:15.5px; line-height:1.75; color:#463f2f;
  }
  .answer.open{ display:block; }
  .answer .lbl{ font-size:11px; color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif; margin-bottom:4px; }

  .empty-note{ font-size:14px; color:var(--ink-soft); padding:16px 2px; }

  /* calendar view */
  .month-head{ font-size:13.5px; font-weight:700; color:var(--navy); margin:22px 2px 8px; }
  .month-head:first-child{ margin-top:4px; }
  .day-row{ display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--rule); cursor:pointer; }
  .day-row .dd{ width:54px; flex:none; }
  .day-row .dd .num{ font-size:16px; font-weight:700; font-family:'Noto Serif KR',serif; }
  .day-row .dd .wd{ font-size:11px; color:var(--ink-soft); }
  .day-row .mid{ flex:1; min-width:0; }
  .day-row .mid .info{ font-size:13.5px; font-weight:500; }
  .day-row .mid .cnt{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .day-row .pct{ font-size:12.5px; font-weight:700; color:var(--sage); flex:none; }
  .day-row.today{ background:var(--navy-tint); border-radius:10px; }
  .filter-row{ display:flex; gap:8px; margin:14px 2px 0; }
  .filter-chip{
    padding:6px 14px; border-radius:16px; font-size:13px; border:1px solid var(--rule); background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .filter-chip.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  /* progress view */
  .stat-hero{ text-align:center; padding:22px 0 8px; }
  .stat-hero .num{ font-size:44px; font-weight:700; font-family:'Noto Serif KR',serif; color:var(--navy); }
  .stat-hero .lbl{ font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .track-card{ background:#fff; border:1px solid var(--rule); border-radius:14px; padding:16px 16px 14px; margin-bottom:14px; box-shadow:var(--shadow); }
  .track-card h3{ font-size:14.5px; margin:0 0 2px; }
  .track-card .desc{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;}
  .cyc-row{ display:flex; align-items:center; gap:10px; padding:6px 0; }
  .cyc-row .cyc-lbl{ width:56px; flex:none; font-size:12.5px; color:var(--ink-soft); }
  .cyc-row .cyc-track{ flex:1; height:8px; background:var(--rule); border-radius:4px; overflow:hidden; }
  .cyc-row .cyc-fill{ height:100%; border-radius:4px; }
  .track-card.a .cyc-fill{ background:var(--navy); }
  .track-card.b .cyc-fill{ background:var(--amber); }
  .cyc-row .cyc-pct{ width:38px; flex:none; text-align:right; font-size:12px; color:var(--ink-soft); }

  .flag-list li{ display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--rule); }
  .flag-list .ref{ flex:1; font-size:14.5px; }
  .flag-list button{ font-size:12px; border:1px solid var(--rule); background:#fff; border-radius:12px; padding:5px 12px; color:var(--ink-soft); }
  .reset-btn{ display:block; margin:26px auto 8px; font-size:13px; color:var(--danger); background:none; border:none; text-decoration:underline; }

  /* tab bar */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(248,244,236,0.92); backdrop-filter: blur(10px);
    border-top:1px solid var(--rule);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabbar .inner{ max-width:700px; margin:0 auto; display:flex; }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif; font-size:11px; cursor:pointer;
  }
  nav.tabbar button svg{ width:22px; height:22px; }
  nav.tabbar button.active{ color:var(--navy); }

  .view{ display:none; }
  .view.active{ display:block; }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <p class="app-title">수련목회자 선발고시 · 암송 167구절</p>
    <div class="date-nav" id="dateNav">
      <button class="navbtn" id="prevBtn" aria-label="이전 날">‹</button>
      <div class="date-center" id="dateCenter">
        <div class="big" id="dateBig">9월 1일 (화)</div>
        <div class="sub" id="dateSub"><span class="badge a">집중암기 · 1회차 1/15</span></div>
      </div>
      <button class="navbtn" id="nextBtn" aria-label="다음 날">›</button>
    </div>
  </div>
</header>

<div class="wrap">

  <main id="viewToday" class="view active">
    <section class="block" id="blockReview">
      <div class="block-head">
        <h2>전날 복습</h2>
        <span class="count" id="reviewCount">0/0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="reviewProg" style="width:0%"></div></div>
      <ul class="itemlist" id="reviewList"></ul>
    </section>

    <section class="block" id="blockToday">
      <div class="block-head">
        <h2 id="todayHeading">오늘의 새 학습</h2>
        <span class="count" id="todayCount">0/0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="todayProg" style="width:0%"></div></div>
      <ul class="itemlist" id="todayList"></ul>
    </section>
  </main>

  <main id="viewCalendar" class="view">
    <div class="filter-row">
      <button class="filter-chip active" data-f="all">전체</button>
      <button class="filter-chip" data-f="집중암기">집중암기</button>
      <button class="filter-chip" data-f="유지복습">유지복습</button>
    </div>
    <div id="calendarBody"></div>
  </main>

  <main id="viewProgress" class="view">
    <div class="stat-hero">
      <div class="num" id="heroPct">0%</div>
      <div class="lbl" id="heroSub">전체 진행률 (0 / 0회)</div>
    </div>

    <div class="track-card a">
      <h3>트랙 A · 집중암기</h3>
      <div class="desc">아직 암기가 필요한 126구절 · 10회독</div>
      <div id="trackACycles"></div>
    </div>

    <div class="track-card b">
      <h3>트랙 B · 유지복습</h3>
      <div class="desc">이미 암기한 41구절 · 5회 점검</div>
      <div id="trackBCycles"></div>
    </div>

    <div class="track-card">
      <h3>취약 표시</h3>
      <div class="desc" id="flagDesc">표시해 둔 구절이 없습니다</div>
      <ul class="flag-list" id="flagList"></ul>
    </div>

    <button class="reset-btn" id="resetBtn">전체 진행 기록 초기화</button>
  </main>

</div>

<nav class="tabbar">
  <div class="inner">
    <button class="tabbtn active" data-view="viewToday">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M8 2v4M16 2v4M4 10h16"/></svg>
      오늘
    </button>
    <button class="tabbtn" data-view="viewCalendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v15H4z"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>
      전체일정
    </button>
    <button class="tabbtn" data-view="viewProgress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      진행상황
    </button>
  </div>
</nav>

<script>
const ITEMS = {"구약 1-1": ["구약1절", "창세기 1장 1절 태초에", "태초에 하나님이 천지를 창조하시니라", true], "구약 1-2": ["구약1절", "창세기 2장 3절 하나님이", "하나님이 그 일곱째 날을 복되게 하사 거룩하게 하셨으니 이는 하나님이 그 창조하시며 만드시던 모든 일을 마치시고 그 날에 안식하셨음이니라", false], "구약 1-3": ["구약1절", "창세기 2장 7절 여호와", "여호와 하나님이 땅의 흙으로 사람을 지으시고 생기를 그 코에 불어넣으시니 사람이 생령이 되니라", false], "구약 1-4": ["구약1절", "출애굽기 3장 14절 하나님이", "하나님이 모세에게 이르시되 나는 스스로 있는 자이니라 또 이르시되 너는 이스라엘 자손에게 이같이 이르기를 스스로 있는 자가 나를 너희에게 보내셨다 하라", true], "구약 1-5": ["구약1절", "출애굽기 13장 3절 모세가", "모세가 백성에게 이르되 너희는 애굽 곧 종 되었던 집에서 나온 그 날을 기념하여 유교병을 먹지 말라 여호와께서 그 손의 권능으로 너희를 그 곳에서 인도해 내셨음이니라", false], "구약 1-6": ["구약1절", "출애굽기 20장 2절 나는", "나는 너를 애굽 땅, 종 되었던 집에서 인도하여 낸 네 하나님 여호와니라", false], "구약 1-7": ["구약1절", "출애굽기 23장 16절 맥추절을", "맥추절을 지키라 이는 네가 수고하여 밭에 뿌린 것의 첫 열매를 거둠이니라 수장절을 지키라 이는 네가 수고하여 이룬 것을 연말에 밭에서부터 거두어 저장함이니라", false], "구약 1-8": ["구약1절", "레위기 18장 4절 너희는", "너희는 내 법도를 따르며 내 규례를 지켜 그대로 행하라 나는 너희의 하나님 여호와이니라", false], "구약 1-9": ["구약1절", "레위기 19장 2절 너는", "너는 이스라엘 자손의 온 회중에게 말하여 이르라 너희는 거룩하라 이는 나 여호와 너희 하나님이 거룩함이니라", false], "구약 1-10": ["구약1절", "레위기 19장 18절 원수를", "원수를 갚지 말며 동포를 원망하지 말며 네 이웃 사랑하기를 네 자신과 같이 사랑하라 나는 여호와이니라", false], "구약 1-11": ["구약1절", "민수기 23장 19절 하나님은", "하나님은 사람이 아니시니 거짓말을 하지 않으시고 인생이 아니시니 후회가 없으시도다 어찌 그 말씀하신 바를 행하지 않으시며 하신 말씀을 실행하지 않으시랴", true], "구약 1-12": ["구약1절", "민수기 35장 34절 너희는", "너희는 너희가 거주하는 땅 곧 내가 거주하는 땅을 더럽히지 말라 나 여호와는 이스라엘 자손 중에 있음이니라", false], "구약 1-13": ["구약1절", "신명기 8장 2절 네 하나님", "네 하나님 여호와께서 이 사십 년 동안에 네게 광야 길을 걷게 하신 것을 기억하라 이는 너를 낮추시며 너를 시험하사 네 마음이 어떠한지 그 명령을 지키는지 지키지 않는지 알려 하심이라", false], "구약 1-14": ["구약1절", "신명기 15장 11절 땅에는", "땅에는 언제든지 가난한 자가 그치지 아니하겠으므로 내가 네게 명령하여 이르노니 너는 반드시 네 땅 안에 네 형제 중 곤란한 자와 궁핍한 자에게 네 손을 펼지니라", false], "구약 1-15": ["구약1절", "신명기 28장 1절 네가", "네가 네 하나님 여호와의 말씀을 삼가 듣고 내가 오늘 네게 명령하는 그의 모든 명령을 지켜 행하면 네 하나님 여호와께서 너를 세계 모든 민족 위에 뛰어나게 하실 것이라", false], "구약 1-16": ["구약1절", "신명기 32장 39절 이제는", "이제는 나 곧 내가 그인 줄 알라 나 외에는 신이 없도다 나는 죽이기도 하며 살리기도 하며 상하게도 하며 낫게도 하나니 내 손에서 능히 빼앗을 자가 없도다", false], "구약 1-17": ["구약1절", "여호수아 11장 23절 이와", "이와 같이 여호수아가 여호와께서 모세에게 00편 4절 감사함으로", "감사함으로 그의 문에 들어가며 찬송함으로 그의 궁정에 들어가서 그에게 감사하며 그의 이름을 송축할지어다", true], "구약 1-50": ["구약1절", "시편 103편 5절 좋은", "좋은 것으로 네 소원을 만족하게 하사 네 청춘을 독수리 같이 새롭게 하시는도다", false], "구약 1-51": ["구약1절", "시편 107편 9절 그가", "그가 사모하는 영혼에게 만족을 주시며 주린 영혼에게 좋은 것으로 채워주심이로다", false], "구약 1-52": ["구약1절", "시편 119편 71절 고난", "고난 당한 것이 내게 유익이라 이로 말미암아 내가 주의 율례들을 배우게 되었나이다", false], "구약 1-53": ["구약1절", "시편 119편 103절 주의", "주의 말씀의 맛이 내게 어찌 그리 단지요 내 입에 꿀보다 더 다니이다", false], "구약 1-54": ["구약1절", "시편 126편 5절 눈물을", "눈물을 흘리며 씨를 뿌리는 자는 기쁨으로 거두리로다", false], "구약 1-55": ["구약1절", "시편 127편 1절 여호와께서", "여호와께서 집을 세우지 아니하시면 세우는 자의 수고가 헛되며 여호와께서 성을 지키지 아니하시면 파수꾼의 깨어 있음이 헛되도다", false], "구약 1-56": ["구약1절", "시편 146편 5절 야곱의", "야곱의 하나님을 자기의 도움으로 삼으며 여호와 자기 하나님에게 자기의 소망을 두는 자는 복이 있도다", false], "구약 1-57": ["구약1절", "잠언 1장 7절 여호와를", "여호와를 경외하는 것이 지식의 근본이거늘 미련한 자는 지혜와 훈계를 멸시하느니라", true], "구약 1-58": ["구약1절", "잠언 3장 6절 너는", "너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라", false], "구약 1-59": ["구약1절", "잠언 4장 23절 모든", "모든 지킬 만한 것 중에 더욱 네 마음을 지키라 생명의 근원이 이에서 남이니라", false], "구약 1-60": ["구약1절", "잠언 15장 16절 가산이", "가산이 적어도 여호와를 경외하는 것이 크게 부하고 번뇌하는 것보다 나으니라", false], "구약 1-61": ["구약1절", "잠언 16장 3절 너의", "너의 행사를 여호와께 맡기라 그리하면 네가 경영하는 것이 이루어지리라", false], "구약 1-62": ["구약1절", "잠언 16장 18절 교만은", "교만은 패망의 선봉이요 거만한 마음은 넘어짐의 앞잡이니라", true], "구약 1-63": ["구약1절", "잠언 16장 32절 노하기를", "노하기를 더디하는 자는 용사보다 낫고 자기의 마음을 다스리는 자는 성을 빼앗는 자보다 나으니라", true], "구약 1-64": ["구약1절", "잠언 17장 22절 마음의", "마음의 즐거움은 양약이라도 심령의 근심은 뼈를 마르게 하느니라", false], "구약 1-65": ["구약1절", "잠언 31장 30절 고운", "고운 것도 거짓되고 아름다운 것도 헛되나 오직 여호와를 경외하는 여자는 칭찬을 받을 것이라", false], "구약 1-66": ["구약1절", "전도서 1장 2절 전도자가", "전도자가 이르되 헛되고 헛되며 헛되고 헛되니 모든 것이 헛되도다", true], "구약 1-67": ["구약1절", "전도서 3장 1절 범사에", "범사에 기한이 있고 천하만사가 다 때가 있나니", false], "구약 1-68": ["구약1절", "전도서 3장 11절 하나님이", "하나님이 모든 것을 지으시되 때를 따라 아름답게 하셨고 또 사람들에게는 영원을 사모하는 마음을 주셨느니라 그러나 하나님이 하시는 일의 시종을 사람으로 측량할 수 없게 하셨도다", false], "구약 1-69": ["구약1절", "전도서 7장 14절 형통한", "형통한 날에는 기뻐하고 곤고한 날에는 되돌아 보아라 이 두 가지를 하나님이 병행하게 하사 사람이 그의 장래 일을 능히 헤아려 알지 못하게 하셨느니라", true], "구약 1-70": ["구약1절", "전도서 11장 1절 너는", "너는 네 떡을 물 위에 던져라 여러 날 후에 도로 찾으리라", true], "구약 1-71": ["구약1절", "이사야 1장 18절 여호와께서", "여호와께서 말씀하시되 오라 우리가 서로 변론하자 너희의 죄가 주홍 같을지라도 눈과 같이 희어질 것이요 진홍 같이 붉을지라도 양털 같이 희게 되리라", false], "구약 1-72": ["구약1절", "이사야 9장 6절 이는", "이는 한 아기가 우리에게 났고 한 아들을 우리에게 주신 바 되었는데 그의 어깨에는 정사를 메었고 그의 이름은 기묘자라 모사라 전능하신 하나님이라 영존하시는 아버지라 평강의 왕이라 할 것임이라", false], "구약 1-73": ["구약1절", "이사야 26장 3절 주께서", "주께서 심지가 견고한 자를 평강하고 평강하도록 지키시리니 이는 그가 주를 신뢰함이니이다", false], "구약 1-74": ["구약1절", "이사야 40장 8절 풀은", "풀은 마르고 꽃은 시드나 우리 하나님의 말씀은 영원히 서리라 하라", false], "구약 1-75": ["구약1절", "이사야 40장 31절 오직", "오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리가 날개치며 올라감 같을 것이요 달음박질하여도 곤비하지 아니하겠고 걸어가도 피곤하지 아니하리로다", false], "구약 1-76": ["구약1절", "이사야 42장 3절 상한", "상한 갈대를 꺾지 아니하며 꺼져가는 등불을 끄지 아니하고 진실로 정의를 시행할 것이며", false], "구약 1-77": ["구약1절", "이사야 43장 21절 이 백성은", "이 백성은 내가 나를 위하여 지었나니 나를 찬송하게 하려 함이니라", false], "구약 1-78": ["구약1절", "이사야 53장 5절 그가", "그가 찔림은 우리 허물 때문이요 그가 상함은 우리의 죄악 때문이라 그가 징계를 받으므로 우리는 평화를 누리고 그가 채찍에 맞으므로 우리는 나음을 받았도다", true], "구약 1-79": ["구약1절", "이사야 55장 1절 오호라", "오호라 너희 모든 목마른 자들아 물로 나아오라 돈 없는 자도 오라 너희는 와서 사 먹되 돈 없이 값 없이 와서 포도주와 젖을 사라", false], "구약 1-80": ["구약1절", "이사야 55장 6절 너희는", "너희는 여호와를 만날 만한 때에 찾으라 가까이 계실 때에 그를 부르라", false], "구약 1-81": ["구약1절", "이사야 58장 6절 내가", "내가 기뻐하는 금식은 흉악의 결박을 풀어 주며 멍에의 줄을 끌러 주며 압제 당하는 자를 자유하게 하며 모든 멍에를 꺾는 것이 아니겠느냐", false], "구약 1-82": ["구약1절", "이사야 64장 8절 그러나", "그러나 여호와여 이제 주는 우리 아버지시니이다 우리는 진흙이요 주는 토기장이시니 우리는 다 주의 손으로 지으신 것이니이다", false], "구약 1-83": ["구약1절", "예레미야 29장 11절 여호와의", "여호와의 말씀이니라 너희를 향한 나의 생각을 내가 아나니 평안이요 재앙이 아니니라 너희에게 미래와 희망을 주는 것이니라", false], "구약 1-84": ["구약1절", "예레미야 29장 13절 너희가", "너희가 온 마음으로 나를 구하면 나를 찾을 것이요 나를 만나리라", false], "구약 1-85": ["구약1절", "예레미야 33장 3절 너는", "너는 내게 부르짖으라 내가 네게 응답하겠고 네가 알지 못하는 크고 은밀한 일을 네게 보이리라", true], "구약 1-86": ["구약1절", "에스겔 36장 26절 또 새 영을", "또 새 영을 너희 속에 두고 새 마음을 너희에게 주되 너희 육신에서 굳은 마음을 제거하고 부드러운 마음을 줄 것이며", false], "구약 1-87": ["구약1절", "다니엘 12장 3절 지혜", "지혜 있는 자는 궁창의 빛과 같이 빛날 것이요 많은 사람을 옳은 데로 돌아오게 한 자는 별과 같이 영원토록 빛나리라", true], "구약 1-88": ["구약1절", "호세아 6장 1절 오라", "오라 우리가 여호와께로 돌아가자 여호와께서 우리를 찢으셨으나 도로 낫게 하실 것이요 우리를 치셨으나 싸매어 주실 것임이라", false], "구약 1-89": ["구약1절", "호세아 6장 3절 그러므로", "그러므로 우리가 여호와를 알자 힘써 여호와를 알자 그의 나타나심은 새벽 빛 같이 어김없나니 비와 같이 땅을 적시는 늦은 비와 같이 우리에게 임하시리라 하니라", false], "구약 1-90": ["구약1절", "호세아 6장 6절 나는", "나는 인애를 원하고 제사를 원하지 아니하며 번제보다 하나님을 아는 것을 원하노라", false], "구약 1-91": ["구약1절", "요엘 2장 13절 너희는", "너희는 옷을 찢지 말고 마음을 찢고 너희 하나님 여호와께로 돌아올지어다 그는 은혜로우시며 자비로우시며 노하기를 더디하시며 인애가 크시사 뜻을 돌이켜 재앙을 내리지 아니하시나니", false], "구약 1-92": ["구약1절", "나훔 1장 7절 여호와는", "여호와는 선하시며 환난 날에 산성이시라 그는 자기에게 피하는 자들을 아시느니라", false], "구약 1-93": ["구약1절", "하박국 3장 18절 나는", "나는 여호와로 말미암아 즐거워하며 나의 구원의 하나님으로 말미암아 기뻐하리로다", false], "구약 1-94": ["구약1절", "스바냐 3장 17절 너의", "너의 하나님 여호와가 너의 가운데에 계시니 그는 구원을 베푸실 전능자이시라 그가 너로 말미암아 기쁨을 이기지 못하시며 너를 잠잠히 사랑하시며 너로 말미암아 즐거이 부르며 기뻐하시리라 하리라", true], "구약 1-95": ["구약1절", "말라기 3장 10절 만군의", "만군의 여호와가 이르노라 너희의 온전한 십일조를 창고에 들여 나의 집에 양식이 있게 하고 그것으로 나를 시험하여 내가 하늘 문을 열고 너희에게 복을 쌓을 곳이 없도록 붓지 아니하나 보라 < 수련목회자 선발고시 구약 암송 2절 이상 >", true], "구약 2-1": ["구약2절+", "창세기 1장 27절 ~ 28절 하나님이", "27절 하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되 남자와 여자를 창조하시고 28절 하나님이 그들에게 복을 주시며 하나님이 그들에게 이르시되 생육하고 번성하여 땅에 충만하라 땅을 정복하라 바다의 물고기와 하늘의 새와 땅에 움직이는 모든 생명을 다스리라 하시니라", true], "구약 2-2": ["구약2절+", "창세기 12장 1절 ~ 2절 여호와께서", "1절 여호와께서 아브람에게 이르시되 너는 너의 고향과 친척과 아버지의 집을 떠나 내가 네게 보여 줄 땅으로 가라 2절 내가 너로 큰 민족을 이루고 네게 복을 주어 네 이름을 창대하게 하리니 너는 복이 될지라", false], "구약 2-3": ["구약2절+", "출애굽기 14장 13절 ~ 14절 모세가", "13절 모세가 백성에게 이르되 너희는 두려워하지 말고 가만히 서서 여호와께서 오늘 너희를 위하여 행하시는 구원을 보라 너희가 오늘 본 애굽 사람을 영원히 다시 보지 아니하리라 14절 여호와께서 너희를 위하여 싸우시리니 너희는 가만히 있을지니라", false], "구약 2-4": ["구약2절+", "출애굽기 19장 5절 ~ 6절 세계가", "5절 세계가 다 내게 속하였나니 너희가 내 말을 잘 듣고 내 언약을 지키면 너희는 모든 민족 중에서 내 소유가 되겠고 6절 너희가 내게 대하여 제사장 나라가 되며 거룩한 백성이 되리라 너는 이 말을 이스라엘 자손에게 전할지니라", true], "구약 2-5": ["구약2절+", "민수기 6장 23절 ~ 26절 아론과", "23절 아론과 그의 아들들에게 말하여 이르기를 너희는 이스라엘 자손을 위하여 이렇게 축복하여 이르되 24절 여호와는 네게 복을 주시고 너를 지키시기를 원하며 25절 여호와는 그의 얼굴을 네게 비추사 은혜 베푸시기를 원하며 26절 여호와는 그 얼굴을 네게로 향하여 드사 평강 주시기를 원하노라 할지니라 하라", false], "구약 2-6": ["구약2절+", "신명기 6장 4절 ~ 5절 너는", "4절 이스라엘아 들으라 우리 하나님 여호와는 오직 유일한 여호와이시니 5절 너는 마음을 다하고 뜻을 다하고 힘을 다하여 네 하나님 여호와를 사랑하라", false], "구약 2-7": ["구약2절+", "여호수아 1장 8절 ~ 9절 이 율법책을", "8절 이 율법책을 네 입에서 떠나지 말게 하며 주야로 그것을 묵상하여 그 안에 기룩된 대로 다 지켜 행하라 그리하면 네 길이 평탄하게 될 것이며 네가 형통하리라 9절 내가 네게 명령한 것이 아니냐 강하고 담대하라 두려워하지 말며 놀라지 말라 네가 어디로 가든지 네 하나님 여호와가 너와 함께 하느니라 하시니라", false], "구약 2-8": ["구약2절+", "사무엘상 3장 10절 ~ 11절 여호와께서", "10절 여호와께서 임하여 서서 전과 같이 사무엘아 사무엘아 부르시는지라 사무엘이 이르되 말씀하옵소서 주의 종이 듣겠나이다 하니 11절 여호와께서 사무엘에게 이르시되 보라 내가 이스라엘 중에 한 일을 행하리니 그것을 듣는 자마다 두 귀가 울리리라", false], "구약 2-9": ["구약2절+", "사무엘상 12장 23절 ~ 24절 나는", "23절 나는 너희를 위하여 기도하기를 쉬는 죄를 여호와 앞에 결단코 범하지 아니하고 선하고 의로운 길을 너희에게 가르칠 것인즉 24절 너희는 여호와께서 너희를 위하여 행하신 그 큰 일을 생각하여 오직 그를 경외하며 너희의 마음을 다하여 진실히 섬기라", false], "구약 2-10": ["구약2절+", "요엘 2장 28절 ~ 29절 그 후에", "28절 그 후에 내가 내 영을 만민에게 부어 주리니 너희 자녀들이 장래 일을 말할 것이며 너희 늙은이는 꿈을 꾸며 너희 젊은이는 이상을 볼 것이며 29절 그 때에 내가 또 내 영을 남종과 여종에게 부어 줄 것이며 < 수련목회자 선발고시 신약 암송 1절 >", false], "신약 1-1": ["신약1절", "마태복음 1장 21절 아들을", "아들을 낳으리니 이름을 예수라 하라 이는 그가 자기 백성을 그들의 죄에서 구원할 자이심이라 하니라", true], "신약 1-2": ["신약1절", "마태복음 5장 16절 이같이", "이같이 너희 빛이 사람 앞에 비치게 하여 그들로 너희 착한 행실을 보고 하늘에 계신 너희 아버지께 영광을 돌리게 하라", true], "신약 1-3": ["신약1절", "마태복음 5장 20절 내가", "내가 너희에게 이르노니 너희 의가 서기관과 바리새인보다 더 낫지 못하면 결코 천국에 들어가지 못하리라", false], "신약 1-4": ["신약1절", "마태복음 6장 20절 오직", "오직 너희를 위하여 보물을 하늘에 쌓아 두라 거기는 좀이나 동록이 해하지 못하며 도둑이 구멍을 뚫지도 못하고 도둑질도 못하느니라", true], "신약 1-5": ["신약1절", "마태복음 6장 33절 그런즉", "그런즉 너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라", true], "신약 1-6": ["신약1절", "마태복음 7장 7절 구하라", "구하라 그리하면 너희에게 주실 것이요 찾으라 그리하면 찾아낼 것이요 문을 두드리라 그리하면 너희에게 열릴 것이니", true], "신약 1-7": ["신약1절", "마태복음 7장 12절 그러므로", "그러므로 무엇이든지 남에게 대접을 받고자 하는 대로 너희도 남을 대접하라 이것이 율법이요 선지자니라", false], "신약 1-8": ["신약1절", "마태복음 16장 16절 시몬", "시몬 베드로가 대답하여 이르되 주는 그리스도시요 살아 계신 하나님의 아들이시니이다", false], "신약 1-9": ["신약1절", "마태복음 16장 25절 누구든지", "누구든지 제 목숨을 구원하고자 하면 잃을 것이요 누구든지 나를 위하여 제 목숨을 잃으면 찾으리라", false], "신약 1-10": ["신약1절", "마태복음 18장 4절 그러므로", "그러므로 누구든지 이 어린 아이와 같이 자기를 낮추는 사람이 천국에서 큰 자니라", false], "신약 1-11": ["신약1절", "마태복음 21장 22절 너희가", "너희가 기도할 때에 무엇이든지 믿고 구하는 것은 다 받으리라 하시니라", false], "신약 1-12": ["신약1절", "마가복음 1장 15절 이르시되", "이르시되 때가 찼고 하나님의 나라가 가까이 왔으니 회개하고 복음을 믿으라 하시더라", true], "신약 1-13": ["신약1절", "마가복음 9장 23절 예수께서", "예수께서 이르시되 할 수 있거든이 무슨 말이냐 믿는 자에게는 능히 하지 못할 일이 없느니라 하시니", false], "신약 1-14": ["신약1절", "마가복음 12장 17절 이에", "이에 예수께서 이르시되 가이사의 것은 가이사에게 하나님의 것은 하나님께 바치라 하시니 그들이 예수께 대하여 매우 놀랍게 여기더라", false], "신약 1-15": ["신약1절", "누가복음 9장 23절 또 무리에게", "또 무리에게 이르시되 아무든지 나를 따라오려거든 자기를 부인하고 날마다 제 십자가를 지고 나를 따를 것이니라", false], "신약 1-16": ["신약1절", "누가복음 22장 42절 이르시되", "이르시되 아버지여 만일 아버지의 뜻이거든 이 잔을 내게서 옮기시옵소서 그러나 내 원대로 마시옵고 아버지의 원대로 되기를 원하나이다 하시니", false], "신약 1-17": ["신약1절", "요한복음 1장 12절 영접하는", "영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니", true], "신약 1-18": ["신약1절", "요한복음 1장 29절 이튿날", "이튿날 요한이 예수께서 자기에게 나아오심을 보고 이르되 보라 세상 죄를 지고 가는 하나님의 어린 양이로다", false], "신약 1-19": ["신약1절", "요한복음 3장 5절 예수께서", "예수께서 대답하시되 진실로 진실로 네게 이르노니 사람이 물과 성령으로 나지 아니하면 하나님의 나라에 들어갈 수 없느니라", false], "신약 1-20": ["신약1절", "요한복음 3장 16절 하나님이", "하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라", true], "신약 1-21": ["신약1절", "요한복음 4장 14절 내가", "내가 주는 물을 마시는 자는 영원히 목마르지 아니하리니 내가 주는 물은 그 속에서 영생하도록 솟아나는 샘물이 되리라", false], "신약 1-22": ["신약1절", "요한복음 5장 24절 내가", "내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 사망에서 생명으로 옮겼느니라", false], "신약 1-23": ["신약1절", "요한복음 6장 53절 예수께서", "예수께서 이르시되 내가 진실로 진실로 너희에게 이르노니 인자의 살을 먹지 아니하고 인자의 피를 마시지 아니하면 너희 속에 생명이 없느니라", false], "신약 1-24": ["신약1절", "요한복음 14장 6절 예수께서", "예수께서 이르시되 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라", false], "신약 1-25": ["신약1절", "사도행전 1장 8절 오직", "오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라", true], "신약 1-26": ["신약1절", "사도행전 4장 12절 다른", "다른 이로써는 구원을 받을 수 없나니 천하 사람 중에 구원을 받을 만한 다른 이름을 우리에게 주신 일이 없음이라 하였더라", false], "신약 1-27": ["신약1절", "사도행전 16장 31절 이르되", "이르되 주 예수를 믿으라 그리하면 너와 네 집이 구원을 받으리라 하고", false], "신약 1-28": ["신약1절", "로마서 1장 17절 복음에는", "복음에는 하나님의 의가 나타나서 믿음으로 믿음에 이르게 하나니 기록된 바 오직 의인은 믿음으로 말미암아 살리라 함과 같으니라", true], "신약 1-29": ["신약1절", "고린도전서 9장 16절 내가", "내가 복음을 전할지라도 자랑할 것이 없음은 내가 부득불 할 일임이라 만일 복음을 전하지 아니하면 내게 화가 있을 것이로다", false], "신약 1-30": ["신약1절", "고린도후서 5장 17절 그런즉", "그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새 것이 되었도다", false], "신약 1-31": ["신약1절", "고린도후서 13장 5절 너희는", "너희는 믿음 안에 있는가 너희 자신을 시험하고 너희 자신을 확증하라 예수 그리스도께서 너희 안에 계신 줄을 너희가 스스로 알지 못하느냐 그렇지 않으면 너희는 버림 받은 자니라", false], "신약 1-32": ["신약1절", "갈라디아서 2장 20절 내가", "내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사시는 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 자신을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라", true], "신약 1-33": ["신약1절", "에베소서 4장 30절 하나님의", "하나님의 성령을 근심하게 하지 말라 그 안에서 너희가 구원의 날까지 인치심을 받았느니라", false], "신약 1-34": ["신약1절", "빌립보서 3장 12절 내가", "내가 이미 얻었다 함도 아니요 온전히 이루었다 함도 아니라 오직 내가 그리스도 예수께 잡힌 바 된 그것을 잡으려고 달려가노라", false], "신약 1-35": ["신약1절", "골로새서 3장 1절 그러므로", "그러므로 너희가 그리스도와 함께 다시 살리심을 받았으면 위의 것을 찾으라 거기는 그리스도께서 하나님 우편에 앉아 계시느니라", false], "신약 1-36": ["신약1절", "데살로니가전서 5장 23절 평강의", "평강의 하나님이 친히 너희를 온전히 거룩하게 하시고 또 너희의 온 영과 혼과 몸이 우리 주 예수 그리스도께서 강림하실 때에 흠 없게 보전되기를 원하노라", false], "신약 1-37": ["신약1절", "히브리서 4장 12절 하나님의", "하나님의 말씀은 살아 있고 활력이 있어 좌우에 날선 어떤 검보다도 예리하여 혼과 영과 및 관절과 골수를 찔러 쪼개기까지 하며 또 마음의 생각과 뜻을 판단하나니", false], "신약 1-38": ["신약1절", "히브리서 11장 6절 믿음이", "믿음이 없이는 하나님을 기쁘시게 하지 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할지니라", true], "신약 1-39": ["신약1절", "야고보서 1장 5절 너희", "너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고 꾸짖지 아니하시는 하나님께 구하라 그리하면 주시리라", false], "신약 1-40": ["신약1절", "베드로전서 2장 9절 그러나", "그러나 너희는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요 그의 소유가 된 백성이니 이는 너희를 어두운 데서 불러 내어 그의 기이한 빛에 들어가게 하신 이의 아름다운 덕을 선포하게 하려 하심이라", false], "신약 1-41": ["신약1절", "베드로후서 3장 9절 주의", "주의 약속은 어떤 이들이 더디다고 생각하는 것 같이 더딘 것이 아니라 오직 주께서는 너희를 대하여 오래 참으사 아무도 멸망하지 아니하고 다 회개하기에 이르기를 원하시느니라", false], "신약 1-42": ["신약1절", "요한1서 3장 9절 하나님께로부터", "하나님께로부터 난 자마다 죄를 짓지 아니하나니 이는 하나님의 씨가 그의 속에 거함이요 그도 범죄하지 못하는 것은 하나님께로부터 났음이라", false], "신약 1-43": ["신약1절", "요한계시록 3장 20절 볼지어다", "볼지어다 내가 문 밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그와 더불어 먹고 그는 나와 더불어 먹으리라 < 수련목회자 선발고시 신약 암송 2절 이상 >", true], "신약 2-1": ["신약2절+", "마태복음 5장 43절 ~ 44절 또 네 이웃을", "43절 또 네 이웃을 사랑하고 네 원수를 미워하라 하였다는 것을 너희가 들었으나 44절 나는 너희에게 이르노니 너희 원수를 사랑하며 너희를 박해하는 자를 위하여 기도하라", false], "신약 2-2": ["신약2절+", "마태복음 11장 28절 ~ 30절 수고하고", "28절 수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라 29절 나는 마음이 온유하고 겸손하니 나의 멍에를 메고 내게 배우라 그리하면 너희 마음이 쉼을 얻으리니 30절 이는 내 멍에는 쉽고 내 짐은 가벼움이라 하시니라", false], "신약 2-3": ["신약2절+", "마태복음 28장 19절 ~ 20절 그러므로", "19절 그러므로 너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 세례를 베풀고 20절 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라", false], "신약 2-4": ["신약2절+", "마가복음 2장 27절 ~ 28절 또 이르시되", "27절 또 이르시되 안식일이 사람을 위하여 있는 것이요 사람이 안식일을 위하여 있는 것이 아니니 28절 이러므로 인자는 안식일에도 주인이니라", false], "신약 2-5": ["신약2절+", "누가복음 4장 18절 ~ 19절 주의", "18절 주의 성령이 내게 임하셨으니 이는 가난한 자에게 복음을 전하게 하시려고 내게 기름을 부으시고 나를 보내사 포로 된 자에게 자유를 눈 먼 자에게 다시 보게 함을 전파하며 눌린 자를 자유롭게하고 19절 주의 은혜의 해를 전파하게 하려 하심이라 하였더라", false], "신약 2-6": ["신약2절+", "요한복음 7장 37절 ~ 38절 명절", "37절 명절 끝날 곧 큰 날에 예수께서 서서 외쳐 이르시되 누구든지 목마르거든 내게로 와서 마시라 38절 나를 믿는 자는 성경에 이름과 같이 그 배에서 생수의 강이 흘러나오리라 하시니", false], "신약 2-7": ["신약2절+", "요한복음 11장 25절 ~ 26절 예수께서", "25절 예수께서 이르시되 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고, 26절 무릇 살아서 나를 믿는 자는 영원히 죽지 아니하리니 이것을 네가 믿느냐", false], "신약 2-8": ["신약2절+", "로마서 8장 1절 ~ 2절 그러므로", "1절 그러므로 이제 그리스도 예수 안에 있는 자에게 결코 정죄함이 없나니 2절 이는 그리스도 예수 안에 있는 생명의 성령의 법이 죄와 사망의 법에서 너를 해방하였음이라", false], "신약 2-9": ["신약2절+", "갈라디아서 5장 22절 ~ 23절 오직", "23절 오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 24절 온유와 절제니 이같은 것을 금지할 법이 없느니라", false], "신약 2-10": ["신약2절+", "에베소서 2장 8절 ~ 9절 너희는", "8절 너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라 9절 행위에서 난 것이 아니니 이는 누구든지 자랑하지 못하게 함이라", false], "신약 2-11": ["신약2절+", "에베소서 2장 22절 ~ 24절 너희는", "22절 너희는 유혹의 욕심을 따라 썩어져 가는 구습을 따르는 옛 사람을 벗어 버리고 23절 오직 너희의 심령이 새롭게 되어 24절 하나님을 따라 의와 진리의 거룩함으로 지으심을 받은 새 사람을 입으라", false], "신약 2-12": ["신약2절+", "빌립보서 4장 6절 ~ 7절 아무", "6절 아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로 너희 구할 것을 감사함으로 하나님께 아뢰라 7절 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라", false], "신약 2-13": ["신약2절+", "골로새서 3장 13절 const byIndex = {};
SCHEDULE.forEach(r => byIndex[r.i] = r);
const dateToIndex = {};
SCHEDULE.forEach(r => dateToIndex[r.d] = r.i);

let state = { doneByDate: {}, flags: [] };
let currentIndex = 1;
let calFilter = 'all';

function todayISO(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), da = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}

const STORAGE_KEY = 'verse167_progress';
async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.doneByDate = parsed.doneByDate || {};
      state.flags = parsed.flags || [];
    }
  }catch(e){ /* no saved state yet, or storage unavailable */ }
}
let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('save failed', e); }
  }, 150);
}

function isDone(date, id){
  return (state.doneByDate[date] || []).includes(id);
}
function toggleDone(date, id){
  const arr = state.doneByDate[date] || [];
  const i = arr.indexOf(id);
  if(i >= 0) arr.splice(i,1); else arr.push(id);
  state.doneByDate[date] = arr;
  saveState();
}
function isFlagged(id){ return state.flags.includes(id); }
function toggleFlag(id){
  const i = state.flags.indexOf(id);
  if(i >= 0) state.flags.splice(i,1); else state.flags.push(id);
  saveState();
}

function monthLabel(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(m)}월`;
}
function dayLabel(dateStr, weekday){
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(m)}월 ${parseInt(d)}일 (${weekday})`;
}

function checkSVG(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 7"/></svg>';
}
function starGlyph(on){ return on ? '★' : '☆'; }

function renderItemRow(id, date, expandable){
  const it = ITEMS[id];
  const done = isDone(date, id);
  const flagged = isFlagged(id);
  const li = document.createElement('li');
  li.className = 'item';
  li.innerHTML = `
    <div class="item-row ${done?'done':''}">
      <div class="chk ${done?'on':''}">${checkSVG()}</div>
      <div class="item-main">
        <div class="item-id ${it[3]?'known':''}">${id}</div>
        <div class="item-ref">${it[1]}</div>
      </div>
      <div class="star ${flagged?'on':''}">${starGlyph(flagged)}</div>
    </div>
    <div class="answer"><div class="lbl">정답</div>${it[2]}</div>
  `;
  const row = li.querySelector('.item-row');
  const chk = li.querySelector('.chk');
  const star = li.querySelector('.star');
  const ans = li.querySelector('.answer');
  chk.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleDone(date, id);
    const nowDone = isDone(date, id);
    chk.classList.toggle('on', nowDone);
    chk.innerHTML = checkSVG();
    row.classList.toggle('done', nowDone);
    updateCounts();
  });
  star.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleFlag(id);
    const nowOn = isFlagged(id);
    star.classList.toggle('on', nowOn);
    star.textContent = starGlyph(nowOn);
  });
  row.addEventListener('click', () => { ans.classList.toggle('open'); });
  return li;
}

function updateCounts(){
  const day = byIndex[currentIndex];
  const prev = byIndex[currentIndex - 1];
  if(prev){
    const doneN = (state.doneByDate[prev.d]||[]).filter(id => prev.ids.includes(id)).length;
    document.getElementById('reviewCount').textContent = `${doneN}/${prev.ids.length}`;
    document.getElementById('reviewProg').style.width = prev.ids.length ? `${doneN/prev.ids.length*100}%` : '0%';
  }
  const doneN2 = (state.doneByDate[day.d]||[]).filter(id => day.ids.includes(id)).length;
  document.getElementById('todayCount').textContent = `${doneN2}/${day.ids.length}`;
  document.getElementById('todayProg').style.width = day.ids.length ? `${doneN2/day.ids.length*100}%` : '0%';
}

function renderToday(){
  const day = byIndex[currentIndex];
  const prev = byIndex[currentIndex - 1];

  document.getElementById('dateBig').textContent = dayLabel(day.d, day.w);
  const sub = document.getElementById('dateSub');
  if(day.t === '집중암기'){
    sub.innerHTML = `<span class="badge a">집중암기 · ${day.c}회차 ${day.dc}/${day.tc}일</span>`;
  }else{
    sub.innerHTML = `<span class="badge b">유지복습 · ${day.mr}/5회</span>`;
  }

  document.getElementById('prevBtn').disabled = currentIndex <= 1;
  document.getElementById('nextBtn').disabled = currentIndex >= SCHEDULE.length;

  const reviewBlock = document.getElementById('blockReview');
  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  if(prev){
    reviewBlock.style.display = '';
    prev.ids.forEach(id => reviewList.appendChild(renderItemRow(id, prev.d, true)));
  } else {
    reviewBlock.style.display = 'none';
  }

  document.getElementById('todayHeading').textContent = day.t === '유지복습' ? '오늘의 유지복습 (전체 41개)' : '오늘의 새 학습';
  const todayList = document.getElementById('todayList');
  todayList.innerHTML = '';
  day.ids.forEach(id => todayList.appendChild(renderItemRow(id, day.d, true)));

  updateCounts();
}

function renderCalendar(){
  const body = document.getElementById('calendarBody');
  body.innerHTML = '';
  let curMonth = '';
  const t = todayISO();
  SCHEDULE.forEach(row => {
    if(calFilter !== 'all' && row.t !== calFilter) return;
    const ml = monthLabel(row.d);
    if(ml !== curMonth){
      curMonth = ml;
      const h = document.createElement('div');
      h.className = 'month-head';
      h.textContent = curMonth;
      body.appendChild(h);
    }
    const doneN = (state.doneByDate[row.d]||[]).filter(id => row.ids.includes(id)).length;
    const pct = row.ids.length ? Math.round(doneN/row.ids.length*100) : 0;
    const info = row.t === '집중암기' ? `집중암기 · ${row.c}회차 ${row.dc}/${row.tc}일` : `유지복습 · ${row.mr}/5회`;
    const div = document.createElement('div');
    div.className = 'day-row' + (row.d === t ? ' today' : '');
    div.innerHTML = `
      <div class="dd"><div class="num">${row.d.slice(8)}</div><div class="wd">${row.w}요일</div></div>
      <div class="mid"><div class="info">${info}</div><div class="cnt">${row.ids.length}문항</div></div>
      <div class="pct">${pct}%</div>
    `;
    div.addEventListener('click', () => {
      currentIndex = row.i;
      renderToday();
      switchView('viewToday');
    });
    body.appendChild(div);
  });
}

function computeCycleProgress(){
  const aCycles = {};
  const bRounds = {};
  SCHEDULE.forEach(row => {
    const doneN = (state.doneByDate[row.d]||[]).filter(id => row.ids.includes(id)).length;
    if(row.t === '집중암기'){
      if(!aCycles[row.c]) aCycles[row.c] = {done:0, target:0, from:row.d, to:row.d};
      aCycles[row.c].done += doneN;
      aCycles[row.c].target += row.ids.length;
      aCycles[row.c].to = row.d;
    }else{
      bRounds[row.mr] = {done:doneN, target:row.ids.length, date:row.d};
    }
  });
  return {aCycles, bRounds};
}

function renderProgress(){
  const {aCycles, bRounds} = computeCycleProgress();
  let totalDone = 0;
  Object.keys(state.doneByDate).forEach(d => { totalDone += state.doneByDate[d].length; });
  const totalTarget = TRACK_A_TARGET + TRACK_B_TARGET;
  const pct = Math.round(totalDone/totalTarget*100);
  document.getElementById('heroPct').textContent = `${pct}%`;
  document.getElementById('heroSub').textContent = `전체 진행률 (${totalDone} / ${totalTarget}회)`;

  const aWrap = document.getElementById('trackACycles');
  aWrap.innerHTML = '';
  for(let c=1;c<=10;c++){
    const info = aCycles[c] || {done:0,target:0};
    const p = info.target ? Math.round(info.done/info.target*100) : 0;
    const row = document.createElement('div');
    row.className = 'cyc-row';
    row.innerHTML = `<div class="cyc-lbl">집중${c}회</div><div class="cyc-track"><div class="cyc-fill" style="width:${p}%"></div></div><div class="cyc-pct">${p}%</div>`;
    aWrap.appendChild(row);
  }

  const bWrap = document.getElementById('trackBCycles');
  bWrap.innerHTML = '';
  for(let r=1;r<=5;r++){
    const info = bRounds[r] || {done:0,target:TRACK_B_TARGET/5};
    const p = info.target ? Math.round(info.done/info.target*100) : 0;
    const row = document.createElement('div');
    row.className = 'cyc-row';
    row.innerHTML = `<div class="cyc-lbl">유지${r}회</div><div class="cyc-track"><div class="cyc-fill" style="width:${p}%"></div></div><div class="cyc-pct">${p}%</div>`;
    bWrap.appendChild(row);
  }

  const flagList = document.getElementById('flagList');
  const flagDesc = document.getElementById('flagDesc');
  flagList.innerHTML = '';
  if(state.flags.length === 0){
    flagDesc.style.display = '';
  } else {
    flagDesc.style.display = 'none';
    state.flags.forEach(id => {
      const it = ITEMS[id];
      const li = document.createElement('li');
      li.innerHTML = `<div class="ref">${id} · ${it[1]}</div><button>표시 해제</button>`;
      li.querySelector('button').addEventListener('click', () => {
        toggleFlag(id);
        renderProgress();
      });
      flagList.appendChild(li);
    });
  }
}

function switchView(viewId){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === viewId));
  document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.view === viewId));
  document.getElementById('dateNav').style.display = viewId === 'viewToday' ? 'flex' : 'none';
  if(viewId === 'viewCalendar') renderCalendar();
  if(viewId === 'viewProgress') renderProgress();
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if(currentIndex > 1){ currentIndex--; renderToday(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if(currentIndex < SCHEDULE.length){ currentIndex++; renderToday(); }
});
document.querySelectorAll('.tabbtn').forEach(b => {
  b.addEventListener('click', () => switchView(b.dataset.view));
});
document.querySelectorAll('.filter-chip').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    calFilter = b.dataset.f;
    renderCalendar();
  });
});
document.getElementById('resetBtn').addEventListener('click', async () => {
  if(confirm('전체 진행 기록과 취약 표시를 모두 초기화할까요? 되돌릴 수 없습니다.')){
    state = { doneByDate: {}, flags: [] };
    saveState();
    renderToday();
    renderProgress();
  }
});

async function init(){
  await loadState();
  const t = todayISO();
  currentIndex = dateToIndex[t] || 1;
  renderToday();
}
init();
</script>
</body>
